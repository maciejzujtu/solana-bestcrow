services:
  anchor:
    image: quay.io/ottersec/anchor:v1.1.2@sha256:4ef4cf067fb1332ddd2b997a48ed05257854f51067ade342d63ebdc1039fe72e
    platform: linux/amd64
    working_dir: /workspace/rust
    environment:
      NO_DNA: "1"
    volumes:
      - ./rust:/workspace/rust
      - ./scripts:/workspace/scripts:ro
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    profiles: [tools]
    command: ["anchor", "--version"]

  validator:
    image: surfpool/surfpool:1.5.0@sha256:4f7b64daa96ab42d8a0d46cd0de556b1c90386f56fd66cfdefcb5f7039fdec9f
    command: ["start", "--no-tui", "--no-studio", "--offline", "--no-deploy", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8899:8899"
      - "127.0.0.1:8900:8900"
    profiles: [localnet]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RPC_URL: ${RPC_URL:-https://api.devnet.solana.com}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3001}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16384}
      STAGEGATE_PROGRAM_ID: ${STAGEGATE_PROGRAM_ID:-EousWVK2cePYb9zvv1oWSca4VNdRQqYef8CsxQ6BL57R}
      USDC_MINTS: ${USDC_MINTS:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU,EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
      POLL_MS: ${POLL_MS:-0}
      KEEPER_AUTOSEND: ${KEEPER_AUTOSEND:-0}
      KEEPER_KEYPAIR_PATH: ${KEEPER_KEYPAIR_PATH:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:${PORT:-3001}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [backend]

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${FRONTEND_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_BESTCROW_PROGRAM_ID: ${STAGEGATE_PROGRAM_ID:-EousWVK2cePYb9zvv1oWSca4VNdRQqYef8CsxQ6BL57R}
        NEXT_PUBLIC_USDC_MINT: ${FRONTEND_USDC_MINT:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
    environment:
      PORT: "3000"
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:3001}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-1500}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${FRONTEND_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_BESTCROW_PROGRAM_ID: ${STAGEGATE_PROGRAM_ID:-EousWVK2cePYb9zvv1oWSca4VNdRQqYef8CsxQ6BL57R}
      NEXT_PUBLIC_USDC_MINT: ${FRONTEND_USDC_MINT:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [frontend]

volumes:
  cargo-registry:
  cargo-git:
