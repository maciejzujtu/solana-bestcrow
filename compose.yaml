# One command to present:  docker compose up --build
# Web: http://localhost:3000   API: http://localhost:4000/api/health
name: charity-vault

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_SOLANA_RPC_FALLBACK_URL: ${NEXT_PUBLIC_SOLANA_RPC_FALLBACK_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_CHARITY_VAULT_PROGRAM_ID: ${CHARITY_VAULT_PROGRAM_ID:-74GsU9xRv9qvVHXXvTAAmRp8ETTEAwGjV1UkJQ6BZNpG}
        NEXT_PUBLIC_SOLANA_RPC_RETRY_ATTEMPTS: ${RPC_RETRY_ATTEMPTS:-3}
        NEXT_PUBLIC_SOLANA_RPC_RETRY_BASE_DELAY_MS: ${RPC_RETRY_BASE_DELAY_MS:-250}
    image: charity-vault-web:latest
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

  backend:
    build: ./backend
    image: charity-vault-backend:latest
    init: true
    environment:
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      RPC_RETRY_ATTEMPTS: ${RPC_RETRY_ATTEMPTS:-3}
      RPC_RETRY_BASE_DELAY_MS: ${RPC_RETRY_BASE_DELAY_MS:-250}
      CHARITY_VAULT_PROGRAM_ID: ${CHARITY_VAULT_PROGRAM_ID:-74GsU9xRv9qvVHXXvTAAmRp8ETTEAwGjV1UkJQ6BZNpG}
      CLUSTER: devnet
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      WALLET_CHALLENGE_TTL_SECONDS: ${WALLET_CHALLENGE_TTL_SECONDS:-300}
      AUTH_ATTEMPTS_PER_MINUTE: ${AUTH_ATTEMPTS_PER_MINUTE:-20}
      DB_PATH: /app/data/bestcrow.db
      INDEXER_ENABLED: ${INDEXER_ENABLED:-true}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      SIGNATURE_SCAN_LIMIT: ${SIGNATURE_SCAN_LIMIT:-200}
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  backend-data:
